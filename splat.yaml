options:
  basename: pokemonsnap
  find_file_boundaries: True
  compiler: IDO
  mnemonic_ljust: 11
  platform: n64
  base_path: .
  target_path: pokemonsnap.z64
  extensions_path: tools/splat_ext
  ld_script_path: pokemonsnap.ld
  ld_symbol_header_path: build/include/ld_addrs.h
  symbol_addrs_path: tools/symbol_addrs.txt
  symbol_name_format: $VRAM_$ROM
  string_encoding: EUC-JP
  data_string_encoding: EUC-JP
  data_string_guesser_level: 2
  rodata_string_guesser_level: 3
  create_undefined_funcs_auto: false
  subalign: 16
  libultra_symbols: True
