[project]
name = "pokemonsnap"
description = "A WIP decomp of Pokemon Snap"
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "argparse>=1.4.0",
    "gitpython>=3.1.59",
    "mapfile-parser>=2.13.0,<3.0",
    "n64img>=0.3.3",
    "ninja-syntax>=1.7.2",
    "pypng>=0.20220715.0",
    "requests>=2.32.5",
    "spimdisasm>=1.42.3",
    "splat64[mips]>=0.50.0",
]

[tool.uv]
package = false
